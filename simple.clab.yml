name: simple-lab

mgmt:
  network: clab
  ipv4-subnet: 172.22.20.0/24
  ipv6-subnet: 3fff:172:22:20::/64

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.7.1

  nodes:
    companya:
      binds:
        - configs/companya/frr.conf:/etc/frr/frr.conf
        - configs/companya/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    isp1:
      binds:
        - configs/isp1/frr.conf:/etc/frr/frr.conf
        - configs/isp1/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    isp2:
      binds:
        - configs/isp2/frr.conf:/etc/frr/frr.conf
        - configs/isp2/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    companyb:
      binds:
        - configs/companyb/frr.conf:/etc/frr/frr.conf
        - configs/companyb/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    dashboard:
      kind: linux
      # This fork's own build, not upstream's 0.1.0 — that tag predates the
      # escaping fix, the exec timeout, the signal frame, the Traffic view and
      # the event history, so a `clab deploy` against it shows none of them.
      # Pinned by the commit that produced it; `:develop` follows the branch.
      # Digest sha256:9d4aa0235271c9b3f68f8b88747862f91fc8b0def856b0a500a0d756554fcf6c
      # The image carries that commit as org.opencontainers.image.revision, so
      #   docker inspect <container> --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
      # answers which build is running without diffing files against a checkout.
      image: quay.io/ephico2real/bgp-dashboard:sha-9a52441
      image-pull-policy: IfNotPresent   # use cached image after first pull
      ports:
        # Loopback only. `8088:8080` publishes on every interface the host has,
        # so a dashboard with no authentication — it holds the Docker socket —
        # was reachable from the network the moment the lab came up.
        # compose/docker-compose.yml already does this; this is the
        # containerlab path.
        - 127.0.0.1:8088:8080
      env:
        LAB_TOPOLOGY: /lab/topology.yml
        LAB_PREFIX: clab-simple-lab
      binds:
        - /var/run/docker.sock:/var/run/docker.sock
        - simple.clab.yml:/lab/topology.yml:ro
        - configs:/lab/configs:ro

  links:
    # CompanyA <-> ISPs
    - endpoints: ["companya:eth1", "isp1:eth1"]
    - endpoints: ["companya:eth2", "isp2:eth1"]

    # ISP1 <-> ISP2
    - endpoints: ["isp1:eth2", "isp2:eth2"]

    # CompanyB <-> ISPs
    - endpoints: ["companyb:eth1", "isp1:eth3"]
    - endpoints: ["companyb:eth2", "isp2:eth3"]
