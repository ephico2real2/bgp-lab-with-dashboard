name: simple-lab

mgmt:
  network: clab
  ipv4-subnet: 172.22.20.0/24
  ipv6-subnet: 3fff:172:22:20::/64

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.7.1

  nodes:
    companya:
      # The FRR image plus the show-only agent: a pinned management address to
      # bind, and the networks that may ask. Both are needed — measured, a host
      # holding only a transit-link interface reached the agent on its
      # management address after one `ip route add`, because Linux accepts a
      # packet for any local address on any interface.
      image: quay.io/ephico2real/bgp-router-agent:sha-65a3a48
      mgmt-ipv4: 172.22.20.11
      env:
        FRR_AGENT_ADDR: 172.22.20.11:8080
        FRR_AGENT_ALLOW: 172.22.20.0/24
      binds:
        - configs/companya/frr.conf:/etc/frr/frr.conf
        - configs/companya/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    isp1:
      # The FRR image plus the show-only agent: a pinned management address to
      # bind, and the networks that may ask. Both are needed — measured, a host
      # holding only a transit-link interface reached the agent on its
      # management address after one `ip route add`, because Linux accepts a
      # packet for any local address on any interface.
      image: quay.io/ephico2real/bgp-router-agent:sha-65a3a48
      mgmt-ipv4: 172.22.20.13
      env:
        FRR_AGENT_ADDR: 172.22.20.13:8080
        FRR_AGENT_ALLOW: 172.22.20.0/24
      binds:
        - configs/isp1/frr.conf:/etc/frr/frr.conf
        - configs/isp1/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    isp2:
      # The FRR image plus the show-only agent: a pinned management address to
      # bind, and the networks that may ask. Both are needed — measured, a host
      # holding only a transit-link interface reached the agent on its
      # management address after one `ip route add`, because Linux accepts a
      # packet for any local address on any interface.
      image: quay.io/ephico2real/bgp-router-agent:sha-65a3a48
      mgmt-ipv4: 172.22.20.14
      env:
        FRR_AGENT_ADDR: 172.22.20.14:8080
        FRR_AGENT_ALLOW: 172.22.20.0/24
      binds:
        - configs/isp2/frr.conf:/etc/frr/frr.conf
        - configs/isp2/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    companyb:
      # The FRR image plus the show-only agent: a pinned management address to
      # bind, and the networks that may ask. Both are needed — measured, a host
      # holding only a transit-link interface reached the agent on its
      # management address after one `ip route add`, because Linux accepts a
      # packet for any local address on any interface.
      image: quay.io/ephico2real/bgp-router-agent:sha-65a3a48
      mgmt-ipv4: 172.22.20.12
      env:
        FRR_AGENT_ADDR: 172.22.20.12:8080
        FRR_AGENT_ALLOW: 172.22.20.0/24
      binds:
        - configs/companyb/frr.conf:/etc/frr/frr.conf
        - configs/companyb/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    dashboard:
      kind: linux
      # This fork's own build, not upstream's 0.1.0 — that tag predates the
      # escaping fix, the exec timeout, the signal frame, the Traffic view and
      # the event history, so a `clab deploy` against it shows none of them.
      # Pinned by the commit that produced it; `:develop` follows the branch.
      # Digest sha256:274a97b1e235d7e279a23ed60d896ed668e788ab609650eeddb466b404b02ea1
      # The image carries that commit as org.opencontainers.image.revision, so
      #   docker inspect <container> --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
      # answers which build is running without diffing files against a checkout.
      image: quay.io/ephico2real/bgp-dashboard:sha-65a3a48
      image-pull-policy: IfNotPresent   # use cached image after first pull
      ports:
        # Loopback only. `8088:8080` publishes on every interface the host
        # has, so a dashboard with no authentication was reachable from the
        # network the moment the lab came up.
        # compose/docker-compose.yml already does this; this is the
        # containerlab path.
        - 127.0.0.1:8088:8080
      env:
        LAB_TOPOLOGY: /lab/topology.yml
        LAB_PREFIX: clab-simple-lab
        # The management addresses above. No Docker socket: the dashboard
        # reads five `show` commands over HTTP instead of holding the host.
        ROUTERS: >-
          companya=http://172.22.20.11:8080,
          companyb=http://172.22.20.12:8080,
          isp1=http://172.22.20.13:8080,
          isp2=http://172.22.20.14:8080
      binds:
        - simple.clab.yml:/lab/topology.yml:ro
        - configs:/lab/configs:ro

  links:
    # CompanyA <-> ISPs
    - endpoints: ["companya:eth1", "isp1:eth1"]
    - endpoints: ["companya:eth2", "isp2:eth1"]

    # ISP1 <-> ISP2
    - endpoints: ["isp1:eth2", "isp2:eth2"]

    # CompanyB <-> ISPs
    - endpoints: ["companyb:eth1", "isp1:eth3"]
    - endpoints: ["companyb:eth2", "isp2:eth3"]
