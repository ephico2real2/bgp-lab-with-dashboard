<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BGP Lab Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
  <!-- Vendored, not fetched from a CDN at runtime. A lab that is demonstrating
       BGP should not need the public internet to draw its own topology, and a
       script pulled at page load is a third party in the trust boundary of
       every run. Same version that was pinned in the URL: 3.30.4. -->
  <script src="/static/vendor/cytoscape.min.js"></script>
</head>
<body>
  <header>
    <h1>BGP Lab Dashboard</h1>
    <span id="status" class="status status-disconnected">disconnected</span>
  </header>
  <main>
    <section id="graph"></section>
    <aside id="sidebar">
      <h2 id="sidebar-title">Click a router</h2>
      <div id="sidebar-content">
        <p class="hint">Click any node in the topology to see its BGP summary and table.</p>
      </div>
    </aside>
  </main>
  <footer>
    <div class="footer-head">
      <h3>Activity</h3>
      <div class="subtabs" role="tablist" aria-label="Events or traffic">
        <button type="button" role="tab" id="view-events" data-view="events" aria-selected="true">Events</button>
        <button type="button" role="tab" id="view-traffic" data-view="traffic" aria-selected="false">Traffic</button>
      </div>
      <span id="activity-note" class="activity-note"></span>
    </div>
    <ul id="events"></ul>
    <div id="traffic" class="traffic" hidden></div>
  </footer>
  <script src="/static/dashboard.js"></script>
</body>
</html>
